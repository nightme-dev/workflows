title: 每轮把 nightme/assigned 队列里的一个 issue 修好、review 过并处理 findings，开成一个能合的 PR。
args:
  - name: issue
    default: "*"
requires:
  nightme: ">0.9.2"
jobs:
  ship:
    iterations: 1                     # 1 = 只跑一轮
    sleep: 5m                         # 两轮之间的退避
    steps:
      - id: fix
        message: "/gtw fix ${{ args.issue }} -y"
        description: >
          200 且带 issue 事实：挑到了一个 issue，这轮接着往下走。
          issue/branch/worktree/mode 说得出是哪个 issue、在哪个分支、在哪个 worktree 里；changes/paths/staged/unstaged/untracked/commits 说得出 agent 改了什么。
          200 但没有 issue 事实：队列里没有可挑的，这轮到此为止。
          wake_after/candidates/held/blocked/branch_exists/pr_open 说得出为什么没挑到（等多久再来、看了几个候选、几个被别人占着、几个卡在依赖上、几个分支已经在了、几个 PR 已经开着）。
          400：没有 issue 号，或者没有工作区。
          404：这个 issue 不存在。
          409：世界挡着——issue 被别的 agent 占了（label 是 nightme/wip）或者停在别的状态上（label 说是哪个状态）、分支已经在了、或者工作区已经在一次 /gtw fix 里。
          工作区还留在上一个 fix 的 worktree 里时（就是"工作区已经在一次 /gtw fix 里"）：/gtw back 是 agent 能发的命令——直接调它把聊天带回主仓库，再 resume 本步。
          500：worktree 建不出来；或者 worktree 好了而 issue 没送到 agent，事实里带着 issue/branch/worktree/mode；或者 agent 那一轮什么都没留下（changes=0，statusText 是 the agent left the worktree unchanged）。
          agent 什么都没留下时：用 next 跳过本步，下一步的 continue 会把 agent 叫回来接着干。这一步不能重跑——分支和 worktree 已经在了，重跑会撞 409「分支已经在了」。
          worktree 留在那儿时：这一轮到此为止，先把聊天带回主仓库（/gtw back）再收尾。
          503：label 写不上去，或者认不出 git host。
          429：上游被限流——run 停下来等操作员，不要重跑这一步。
          上游失败时结果带的是上游自己的状态码和消息（429 见上）：这一轮到此为止。
          状态码 0：agent 那一轮没有干净结束（被取消、进程死了）——没有结论，事实里也不带 changes；这一轮到此为止。
          跳过本步之前先看有没有 issue 事实：没有 issue 事实时别用 next 跳过它——跳过了它，这一轮会接着走进没有 issue 的流水线，review、commit、push、pr 都会空转。
      - id: fix-continue
        message: continue
        if: steps.fix.outputs.data.changes == 0
        description: >
          fix 报 500 且 agent 什么都没留下（changes=0）时，这一句 continue 递回 chat 里的 agent——
          它还拿着这个 issue 的上下文，让它接着把活干完；干完之后 commit 那一步会把它提交掉。
          200：agent 接着干完了（回合正常结束）。
          这一步只在 changes=0 时跑：其余情形（没有 changes 这个键）它不跑。
      - id: idle
        cmd:
          name: skip
        if: steps.fix.outputs.success && !steps.fix.outputs.data.issue
        description: >
          队列空的那一轮：skip 让这一轮悄悄结束——报告里不留痕迹。
      - id: commit
        message: "/gtw commit"
        agents:
          - mode: args
            names: [pi, codex]
        if: steps.fix.outputs.data.issue
        description: >
          200：改动提交了，branch/sha_range/commits/agent 说得出提交在哪、是哪一段、几个提交。
          200 且 commits=0：真没东西可提交。
          400：这里不是 git 仓库，或者没有工作区。
          404：没有可以接着续的失败提交。
          409：有没解完的冲突、HEAD 是游离的，或者 agent 根本没把活提交了——让 agent 把 worktree 收拾好，真的提交一次。
          500：worktree 的状态读不到。
          429：上游被限流——run 停下来等操作员，不要重跑这一步。
      - id: review
        message: "/review"
        agents:
          - mode: args
            names: [omp, codex]
        description: >
          200：review 跑过了，agent/groups/findings/unfinished/delivered 说得出谁跑的、几组、几条 findings、还有几组没跑完、findings 有没有交到 agent 手里。
          addressed=true：findings 交到 agent 手里之后，工作区多了新提交或新改动——agent 按 findings 改了，下一步 commit-revise 会把它提交掉。
          addressed=false：findings 有了，但工作区没变——agent 判定这些 findings 不成立或不必要。这是正常结果：修复步会被跳过，流程直接进 push → pr。不要为了让流程有事可做而改点什么。
          没有 addressed 这个键：没有 findings（review 没什么可说的）、agent 那一轮没干净结束、或者工作区读不到。
          404：没有可 review 的差异——分支和 base 一样，让 agent 真的改出东西来，再跑 commit 和 review。
          500：review 失败了；statusText 说的是 base 分支既读不到也修不好（先把 base 弄明白），还是 review 本身坏了。
          501：这个 agent 没法 review，换一个能 review 的。
          unfinished 大于 0：链用完了还有组没跑完——不要重跑本步，重跑是一次全新的整审；用 ntm_review --continue 接管剩下那几组。
          429：上游被限流——run 停下来等操作员，不要重跑这一步。
      - id: commit-revise
        message: "/gtw commit"
        agents:
          - mode: args
            names: [pi, codex]
        if: steps.review.outputs.data.addressed
        description: >
          200：改动提交了，branch/sha_range/commits/agent 说得出提交在哪、是哪一段、几个提交。
          200 且 commits=0：真没东西可提交。
          400：这里不是 git 仓库，或者没有工作区。
          404：没有可以接着续的失败提交。
          409：有没解完的冲突、HEAD 是游离的，或者 agent 根本没把活提交了——让 agent 把 worktree 收拾好，真的提交一次。
          500：worktree 的状态读不到。
          429：上游被限流——run 停下来等操作员，不要重跑这一步。
          这一步只在 review 的 addressed 为 true 时跑：findings 没被处理（addressed=false，或者没有这个键）时它被跳过，流程直接进 push → pr。
      - id: push
        message: "/gtw push"
        description: >
          200：分支推上去了，branch/commits/remote_head 说得出推的是哪个分支、几个提交、远端现在指向哪。
          200 且 commits=0：远端已经是这个分支了。
          409：工作区有未提交的改动——先让 agent 把它们提交了。
          409：push 一个提交都没动，可分支上还带着远端没有的提交——先让 agent 把它们提交了。
          500：远端的 tip 读不到。
      - id: pr
        message: "/gtw pr"
        agents:
          - mode: args
            names: [pi, codex]
        description: >
          200：PR 开出来了，pr_number/pr_url 说得出是哪个 PR；PR 已经开着也是正常分支。
          404：分支还没发布到 origin——先让 agent 推上去。
          409：分支对 base 一个提交都没有——让 agent 提交，或者把 base 并进分支。
          500：agent 的回复不是 PR 的格式，format 说得出是哪里不对——标题和正文要按预期的格式写。
          429：上游被限流——run 停下来等操作员，不要重跑这一步。
          这一步不开 --ready：issue 的 nightme/wip 认领留到 pr-ready 那一步才摘。
      - id: pr-wait
        wait: 60s
        description: 等平台算完 PR 的 merge state。
      - id: pr-view
        message: "/gtw pr view ${{ steps.pr.outputs.data.pr_number }}"
        description: >
          200：PR 现在什么状态，pr_state/base_branch/merge_state/conflict 说得出它是开着还是关了、base 是哪个、能不能合、有没有冲突（conflict 是 "true" 或者 "false"）。
          404：这个 PR 不存在。
          503：连不上 git host。
      - id: pr-fix
        message: |
          PR #${{ steps.pr-view.outputs.data.pr_number }} 有合并冲突。
          在这个 worktree 里先 git fetch，再把它的 base 分支（${{ steps.pr-view.outputs.data.base_branch }}）合并进当前分支。
          解掉冲突，提交并推送，让这个 PR 变成可合并。
          不要关 PR，不要动 issue 的 label。
        if: steps.pr-view.outputs.data.conflict
        description: 只有冲突时才让 chat 的 agent 去修：把 base 并进来、解掉冲突、提交并推送，让 PR 变成可合并。
      - id: pr-fix-wait
        wait: 60s
        if: steps.pr-view.outputs.data.conflict
        description: 等平台重算 merge state。
      - id: pr-recheck
        message: "/gtw pr view ${{ steps.pr-view.outputs.data.pr_number }}"
        if: steps.pr-view.outputs.data.conflict
        description: 修完冲突后再查一次 merge state；还冲突就是没修好。
      - id: pr-ready
        message: "/gtw pr --ready"
        if: "!steps.pr-recheck.outputs.data.conflict"
        description: >
          PR 已经开着、冲突也解完了：这一步把 issue 从 nightme/wip 挪到 nightme/ready，并给 PR 贴上 nightme/ready。
          200：PR 已经开着，标签贴上了——PR 已经开着时这一步照样跑标签转换（branch/pr_number/pr_url 说得出是哪个 PR）。
          404：分支还没发布到 origin——先让 agent 推上去。
          贴标签失败只是告警，命令的结论不变。
      - id: back
        message: "/gtw back"
        if: steps.fix.outputs.data.worktree
        description: >
          200：聊天退出 worktree 回到主仓库，worktree/repo_root 说得出退的是哪个、回到哪儿——下一轮从 main 开始。
          400：没有活动的工作区。
          404：没有可以退出的 fix。
          500：聊天退出了 worktree，但主分支没能同步。
