title: 每轮把 nightme/assigned 队列里的一个 issue 修好、review 过并处理 findings，开成一个能合的 PR。
args:
  - name: issue
    default: "*"
jobs:
  ship:
    iterations: 0                     # 0 = 一直跑
    sleep: 5m                         # 两轮之间的退避
    steps:
      - id: fix
        message: "/gtw fix ${{ args.issue }} -y"
        description: 从 nightme/assigned 队列里挑一个 issue 交给 agent 修。挑不到（data.issue 为空）这轮就没活干，后面的步骤都跳过。
      - id: commit
        message: "/gtw commit"
        if: ${{ steps.fix.outputs.data.issue }}
        description: 提交 agent 的改动。真没东西可提交时 instruct 让 agent 改，改完 resume 这一步。
      - id: review
        message: "/review"
        agents:
          - mode: args
            names: [omp, codex]
        if: ${{ steps.fix.outputs.data.issue }}
        description: >-
          review 本分支与 base 的差异，findings 回到聊天里。链 [omp, codex] 自己降级：omp 留下没跑完的组时 codex 只接管那几组，不用你手动降级。
          链用完了还有组没跑完（outcome 带 unfinished）时，别重跑本步 —— 重跑是一次全新的整审，白做。决定模型这时该选 escalate 把活交给 chat 模型，
          chat 模型有 ntm_review 工具：跑 ntm_review(args="--continue") 就能用最后一个 agent 续剩下的组，每组只有一次恢复额度；报 no review to continue（记录没了）就别再试，往下走。
          no_diff 是异常：fix 本该改出了东西，分支却和 base 一样 —— instruct 让 agent 真正改出来，再跑 commit 和 review；
          base_unknown 是 base 分支没解析出来，也什么都没 review，先弄清 base 再跑 review；already_running 就用 wait 等它结束再看。
      - id: commit-revise
        message: "/gtw commit"
        if: ${{ steps.fix.outputs.data.issue }}
        description: 提交 review 后的修改。findings 只修成立且必要的，其余驳回；要修的 instruct 交给 agent 改，改完 resume 这一步。
      - id: push
        message: "/gtw push"
        if: ${{ steps.fix.outputs.data.issue }}
        description: 推送分支。本地还有没推的提交时 instruct 让 agent 提交后 resume 这一步。
      - id: pr
        message: "/gtw pr --ready"
        if: ${{ steps.fix.outputs.data.issue }}
        description: 开 PR 并把 issue 标成 ready。no_remote_branch：instruct 让 agent 推；no_commits：instruct 让 agent 提交；改完 resume 这一步。
      - id: pr-wait
        wait: 60s
        if: ${{ steps.fix.outputs.data.issue }}
        description: 等平台算完 PR 的 merge state。
      - id: pr-view
        message: "/gtw pr view ${{ steps.pr.outputs.data.pr_number }}"
        if: ${{ steps.fix.outputs.data.issue }}
        description: 看 PR 现在能不能合；conflict=1 是正常分支，下面的修复步骤据此处理。
      - id: pr-fix
        message: |
          PR #${{ steps.pr-view.outputs.data.pr_number }} 有合并冲突。
          在这个 worktree 里先 git fetch，再把它的 base 分支（${{ steps.pr-view.outputs.data.base_branch }}）合并进当前分支。
          解掉冲突，提交并推送，让这个 PR 变成可合并。
          不要关 PR，不要动 issue 的 label。
        if: ${{ steps.pr-view.outputs.data.conflict }}
        description: 只有冲突时才让 chat 的 agent 去修。
      - id: pr-fix-wait
        wait: 60s
        if: ${{ steps.pr-view.outputs.data.conflict }}
        description: 等平台重算 merge state。
      - id: pr-recheck
        message: "/gtw pr view ${{ steps.pr-view.outputs.data.pr_number }}"
        if: ${{ steps.pr-view.outputs.data.conflict }}
        description: 修完再查一次；还冲突就是没修好，本轮到此为止。
      - id: back
        message: "/gtw back"
        if: ${{ steps.fix.outputs.data.issue }}
        final: true
        description: 回主仓库目录。下一轮的 fix 必须从 main 开始 —— worktree 里再 fix 会报 already_active。
