<nav class="nav">
  <a href="{{ '/' | relative_url }}">Home</a>
  <a href="{{ '/changes/' | relative_url }}">Changes</a>
  {% assign groups = site.data.workflows | group_by: "namespace" %}
  {% for group in groups %}
  <div class="nav-group">
    <a class="nav-namespace" href="{{ '/' | append: group.name | append: '/' | relative_url }}">{{ group.name }}</a>
    <ul>
      {% for workflow in group.items %}
      <li><a href="{{ '/' | append: workflow.address | append: '/' | relative_url }}">{{ workflow.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</nav>
