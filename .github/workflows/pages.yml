name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job reads the repository and publishes the site. It writes
# nothing but the site: the repository itself is read-only here.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run rebuilds the site of main: a branch that has not
    # been reviewed has no business publishing the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the changes page and the last change of
          # a workflow are read from it.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check what changed
        id: changes
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify --quiet "$base" >/dev/null; then
            # No base commit, or a base that is not in the clone:
            # every file counts as changed.
            base=$(git hash-object -t tree /dev/null)
            files=$(git diff --name-only --no-renames "$base" HEAD -- workflows/ templates/ cmd/site/ go.mod go.sum Gemfile Gemfile.lock)
          else
            files=$(git diff --name-only --no-renames "$base...HEAD" -- workflows/ templates/ cmd/site/ go.mod go.sum Gemfile Gemfile.lock)
          fi
          if [ -z "$files" ]; then
            # Nothing that the site is made of changed: the site that
            # is published is the site of the last build.
            echo "nothing that touches the site changed"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$files"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the site source
        if: steps.changes.outputs.build == 'true'
        run: go run ./cmd/site --templates templates --workflows workflows --out docs
      - uses: ruby/setup-ruby@v1
        if: steps.changes.outputs.build == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the site
        if: steps.changes.outputs.build == 'true'
        run: bundle exec jekyll build --source docs --destination .site
      - name: Build the search index
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          # The version is pinned: the format of the index has to be
          # the one the pages expect.
          npm install --global pagefind@1.4.0
          pagefind --site .site
      - name: Stage the site
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          # The site is staged in a directory of its own: the artifact
          # holds the files of the site and nothing around them.
          cp -a .site site-out
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          # The site travels to the publish job as an archive: the job
          # that publishes it never builds it.
          name: site
          path: site-out
          retention-days: 1

  publish:
    # The publish job is the only job that holds the permissions the
    # publication needs: the build never holds a token that could
    # mint one.
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The credentials of the push: the job writes the site to a
          # branch of this repository.
          persist-credentials: true
      - name: Check out the branch the site is published from
        run: |
          set -euo pipefail
          if git fetch origin gh-pages; then
            git checkout -B gh-pages FETCH_HEAD
          else
            # The branch does not exist yet: the site starts a branch
            # of its own, with no history of the repository in it.
            git checkout --orphan gh-pages
            git rm -rq --ignore-unmatch . || true
          fi
      - name: Empty the branch
        run: |
          set -euo pipefail
          # The branch holds the built site and nothing else: what the
          # last build left behind goes away before the new site is put
          # in its place, so a page that is no longer built is no
          # longer served.
          git rm -rq --ignore-unmatch . || true
          git clean -fdx
      - uses: actions/download-artifact@v4
        with:
          # The site is unpacked outside the branch: it is put on the
          # branch by the next step, not by the unpacker.
          name: site
          path: ${{ runner.temp }}/site
      - name: Put the site on the branch
        run: |
          set -euo pipefail
          cp -a "${{ runner.temp }}/site"/. .
          # The site is served as it is: the Jekyll build of the branch
          # would try to build it a second time.
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "the site did not change"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(pages): publish the site"
          git push origin HEAD:gh-pages
